apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-data
  namespace: session-11

spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: session-11
data:
  nats.conf: |
    port: 4222
    http_port: 8222

    jetstream {
      store_dir: /data/jetstream
    }