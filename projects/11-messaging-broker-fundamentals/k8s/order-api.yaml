apiVersion: apps/v1

kind: Deployment

metadata:
  name: order-api
  namespace: session-11

spec:
  replicas: 1

  selector:
    matchLabels:
      app: order-api

  template:
    metadata:
      labels:
        app: order-api

    spec:
      containers:
        - name: order-api
          image: learning-devops/session-11-order-api:local
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 3000

          env:
            - name: APP_ENV
              value: session-11

            - name: RABBITMQ_HOST
              value: rabbitmq

            - name: RABBITMQ_PORT
              value: "5672"

            - name: RABBITMQ_EXCHANGE
              value: order-exchange

            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-auth
                  key: username

            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-auth
                  key: password

          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
          
          livenessProbe:
            httpGet: 
              path: /health
              port: http
            initialDelaySeconds: 5

--- 
apiVersion: v1

kind: Service

metadata:
  name: order-api
  namespace: session-11

spec:
  type: ClusterIP

  selector:
    app: order-api

  ports:
    - name: http
      port: 80
      targetPort: http