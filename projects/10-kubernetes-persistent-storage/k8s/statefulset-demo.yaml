apiVersion: apps/v1

kind: StatefulSet

metadata:
  name: storage-demo
  namespace: session-10

spec: 
  serviceName: storage-demo
  replicas: 3

  selector:
    matchLabels:
      app: storage-demo

  template:
    metadata:
      labels:
        app: storage-demo

    spec: 
      containers:
        - name: demo
          image: busybox:1.36
          command: 
            - sh
            - -c
            - sleep 3600

          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

          volumeMounts: 
            - name: data
              mountPath: /data

  volumeClaimTemplates:
    - metadata:
        name: data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 100Mi