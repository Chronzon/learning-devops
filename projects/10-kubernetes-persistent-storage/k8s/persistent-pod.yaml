apiVersion: v1 

kind: Pod 

metadata:
  name: persistent-demo
  namespace: session-10

spec: 
  containers:
    - name: persistent-demo
      image: busybox:1.36
      command: 
        - sh
        - -c
        - sleep 3600

      resources:
        requests:
          memory: "32Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "200m"

      volumeMounts:
        - name: persistent-storage
          mountPath: /data

  volumes:
    - name: persistent-storage
      persistentVolumeClaim:
        claimName: session-10-pvc

  restartPolicy: Never