apiVersion: v1 

kind: Pod

metadata:
  name: ephemeral-demo
  namespace: session-10

spec:
  containers:
    - name: ephemeral-demo
      image: busybox:1.36
      command: 
        - sh
        - -c
        - sleep 3600

      resources:
        requests:
          memory: "32Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "200m"

  restartPolicy: Never