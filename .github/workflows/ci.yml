name: CI

on:
  pull_request:
    paths:
      - "projects/06-cd-foundations/app/**"
      - ".github/workflows/ci.yml"

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/06-cd-foundations/app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate Node.js syntax
        run: node --check server.js

      - name: Build container image
        run: |
          docker build -t depslearningdevopsacr06.azurecr.io/learning-devops/session-06:${{ github.sha }} .

      - name: Verify container image
        run: |
          docker run -d --name session-06-ci -e APP_ENV=ci -p 8080:3000 depslearningdevopsacr06.azurecr.io/learning-devops/session-06:${{ github.sha }}

          sleep 2

          curl --fail http://localhost:8080/
          curl --fail http://localhost:8080/health

      - name: Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name depslearningdevopsacr06

      - name: Push validated container image
        run: |
          docker push depslearningdevopsacr06.azurecr.io/learning-devops/session-06:${{ github.sha }}