name: CI 

on: 
  pull_request:

permissions:
  id-token: write
  contents: read

jobs: 
  validate:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: projects/05-secure-ci-image-publishing/app

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name depslearningdevopsacr

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install
      - run: npm test
      - run: npm run build

      - name: Build Docker Image
        run: |
          docker build -t depslearningdevopsacr.azurecr.io/learning-devops/ci-fundamentals:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push depslearningdevopsacr.azurecr.io/learning-devops/ci-fundamentals:${{ github.sha }}