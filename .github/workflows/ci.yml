name: CI 

on: 
  pull_request:

jobs: 
  validate:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: projects/04-ci-cd-fundamentals/app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install
      - run: npm test
      - run: npm run build